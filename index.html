<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbbesBeauty22</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#fff;
color:#222;
}

header{
background:#000;
color:#fff;
padding:15px;
text-align:center;
}

header h1{
margin:0;
color:#ff4fa3;
}

.hero{
background:#ffe6f2;
padding:60px 20px;
text-align:center;
}

.hero h2{
font-size:32px;
}

.hero p{
font-size:18px;
}

button{
background:#ff4fa3;
color:white;
border:none;
padding:15px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.card{
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
padding:20px;
text-align:center;
}

.card img{
width:100%;
border-radius:15px;
}

.price{
color:#ff4fa3;
font-size:22px;
font-weight:bold;
}
</style>

</head>

<body>

<header>
<h1>AbbesBeauty22</h1>
<p>متجر إلكتروني لمنتجات التجميل والعناية بالبشرة</p>
</header>

<section class="hero">
<h2>أهلاً بك في AbbesBeauty22</h2>
<p>أفضل منتجات التجميل بأفضل الأسعار.</p>

<button>ابدأ التسوق</button>

</section>

<section class="products">

<div class="card">
<h3>كريم مرطب</h3>
<p class="price">2500 دج</p>
<button>أضف للسلة</button>
</div>

<div class="card">
<h3>عطر نسائي</h3>
<p class="price">4500 دج</p>
<button>أضف للسلة</button>
</div>

<div class="card">
<h3>أحمر شفاه</h3>
<p class="price">1800 دج</p>
<button>أضف للسلة</button>
</div>

</section>

</body>
</html>
